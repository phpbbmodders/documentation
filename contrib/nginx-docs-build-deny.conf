# Documentation extension (phpbbmodders/documentation) — deny direct web
# access to the raw Hugo docs build, the same way phpBB's own docs/nginx.sample.conf
# denies access to cache/, files/, store/, etc. Without this, the built
# pages are reachable directly at their real filesystem path, bypassing
# the extension's per-section/per-language ACL checks entirely — those
# only run when a request goes through phpBB's own /documentation/...
# route, not a direct hit on this directory.
#
# Not needed for the default build path (store/phpbbmodders_documentation/)
# if your server block includes the store rule from phpBB's
# nginx.sample.conf. These blocks cover both that path and the old default
# inside the extension.
#
# Nginx doesn't read .htaccess, so this needs to be added explicitly to
# your site's server block. Place it alongside phpBB's own "Deny access to
# internal phpbb files" location block, inside the same `server { ... }`
# — see docs/nginx.sample.conf in the phpBB package for that block's
# exact location if you're not sure where.
#
# If phpBB isn't installed at your web root, adjust the paths below to
# match (e.g. if phpBB lives at /forum/, /store/... becomes /forum/store/...).

location ^~ /store/phpbbmodders_documentation/ {
	deny all;
	# deny was ignored before nginx 0.8.40 for connections over IPv6.
	# Use internal directive to prohibit access on older versions.
	internal;
}

location ^~ /ext/phpbbmodders/documentation/docs-build/ {
	deny all;
	internal;
}
