# Documentation extension (phpbbmodders/documentation) — deny direct web
# access to the raw Hugo docs build, the same way phpBB's own
# docs/lighttpd.sample.conf denies access to cache/, files/, store/, etc.
# Without this, the built pages are reachable directly at their real
# filesystem path, bypassing the extension's per-section/per-language ACL
# checks entirely — those only run when a request goes through phpBB's
# own /documentation/... route, not a direct hit on this directory.
#
# Add this inside the same $HTTP["host"] block as phpBB's own "Deny
# access to internal phpbb files" rule (see docs/lighttpd.sample.conf in
# the phpBB package). If phpBB isn't installed at your web root, adjust
# the path below to match.

$HTTP["url"] =~ "^/ext/phpbbmodders/documentation/docs-build/" {
	url.access-deny = ( "" )
}
