# Documentation extension (phpbbmodders/documentation) — deny direct web
# access to the raw Hugo docs build. Without this, the built pages are
# reachable directly at their real filesystem path, bypassing the
# extension's per-section/per-language ACL checks entirely — those only
# run when a request goes through phpBB's own /documentation/... route,
# not a direct hit on this directory.
#
# phpBB ships no Caddy sample config, so nothing denies store/ by default.
# The matcher covers the default build path (store/docs_build/)
# and the old default inside the extension. Add these two lines inside your
# existing site block (the one serving phpBB), above any
# php_fastcgi/file_server directives. Caddy's default directive ordering
# runs `respond` before those regardless of where in the block it's
# written, so this reliably wins even placed at the top.
# If phpBB isn't installed at your site root, adjust the paths below to
# match (e.g. under a /forum/ path, /store/... becomes /forum/store/...).

@phpbbmodders_documentation_docs_build path /store/docs_build/* /ext/phpbbmodders/documentation/docs-build/*
respond @phpbbmodders_documentation_docs_build 403
