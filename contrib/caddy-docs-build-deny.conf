# Documentation extension (phpbbmodders/documentation) — deny direct web
# access to the raw Hugo docs build. Without this, the built pages are
# reachable directly at their real filesystem path, bypassing the
# extension's per-section/per-language ACL checks entirely — those only
# run when a request goes through phpBB's own /documentation/... route,
# not a direct hit on this directory.
#
# Add these two lines inside your existing site block (the one serving
# phpBB), above any php_fastcgi/file_server directives. Caddy's default
# directive ordering runs `respond` before those regardless of where in
# the block it's written, so this reliably wins even placed at the top.
# If phpBB isn't installed at your site root, adjust the path below to
# match (e.g. under a /forum/ path, this becomes
# /forum/ext/phpbbmodders/documentation/docs-build/*).

@phpbbmodders_documentation_docs_build path /ext/phpbbmodders/documentation/docs-build/*
respond @phpbbmodders_documentation_docs_build 403
